[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whatisthis"
version = "0.1.0"
description = "My Experiments with Vison models"
authors = [
    { name="Shyam Sunder" }
]

dependencies = [
    "blinker==1.9.0",
    "click==8.3.1",
    "coloredlogs==15.0.1",
    "flask==3.1.2",
    "flatbuffers==25.12.19",
    "humanfriendly==10.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "matplotlib>=3.10.7",
    "mpmath==1.3.0",
    "numpy==2.4.0",
    "onnxruntime==1.23.2",
    "packaging==25.0",
    "pillow==12.0.0",
    "protobuf==6.33.2",
    "requests>=2.32.5",
    "sympy==1.14.0",
    "torch",
    "werkzeug==3.1.4",
]

