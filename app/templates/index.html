<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <header>
            <div class="logo">
                <svg class="eye-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="32" cy="32" rx="28" ry="16" stroke="currentColor" stroke-width="2.5"/>
                    <circle cx="32" cy="32" r="9" stroke="currentColor" stroke-width="2.5"/>
                    <circle cx="32" cy="32" r="4" fill="currentColor"/>
                    <line x1="32" y1="4" x2="32" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="32" y1="54" x2="32" y2="60" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>Argus</h1>
            <p class="tagline">Visual intelligence. Instant recognition.</p>
        </header>

        <div class="card">
            <div class="drop-area" id="drop-area">
                <input type="file" id="fileElem" accept="image/*">
                <div class="drop-content" id="drop-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <polyline points="17 8 12 3 7 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <p class="drop-main">Drop image here</p>
                    <p class="drop-sub">or <label for="fileElem" class="browse-link">browse files</label></p>
                </div>
                <img id="preview" src="#" alt="Preview"/>
            </div>

            <button id="uploadBtn" disabled>
                <span class="btn-text">Analyze Image</span>
                <div class="btn-spinner" id="spinner"></div>
            </button>

            <div id="result" class="result-area"></div>
        </div>
    </div>

    <script>
        const dropArea = document.getElementById('drop-area');
        const fileElem = document.getElementById('fileElem');
        const uploadBtn = document.getElementById('uploadBtn');
        const preview = document.getElementById('preview');
        const dropContent = document.getElementById('drop-content');
        const spinner = document.getElementById('spinner');
        let file;

        function showPreview(imgFile) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                dropContent.style.display = 'none';
                dropArea.classList.add('has-image');
                uploadBtn.disabled = false;
            };
            reader.readAsDataURL(imgFile);
        }

        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        });
        dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
            file = e.dataTransfer.files[0];
            fileElem.files = e.dataTransfer.files;
            showPreview(file);
        });
        dropArea.addEventListener('click', (e) => {
            if (e.target !== fileElem && !e.target.closest('label')) fileElem.click();
        });
        fileElem.addEventListener('change', (e) => {
            file = e.target.files[0];
            showPreview(file);
        });

        uploadBtn.addEventListener('click', () => {
            if (!file) return;
            const resultEl = document.getElementById('result');
            resultEl.innerHTML = '';
            resultEl.className = 'result-area';
            uploadBtn.disabled = true;
            spinner.style.display = 'block';
            document.querySelector('.btn-text').textContent = 'Analyzing...';

            const formData = new FormData();
            formData.append('image', file);

            fetch('/predict', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    spinner.style.display = 'none';
                    document.querySelector('.btn-text').textContent = 'Analyze Image';
                    uploadBtn.disabled = false;
                    if (data.label) {
                        resultEl.innerHTML = `
                            <div class="result-inner">
                                <span class="result-icon">
                                    <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                                </span>
                                <div>
                                    <p class="result-label-text">Detected</p>
                                    <p class="result-label">${data.label}</p>
                                </div>
                            </div>`;
                        resultEl.classList.add('result-success');
                    } else {
                        resultEl.innerHTML = `<div class="result-inner"><span class="result-icon error-icon">!</span><p class="result-label">${data.error || 'Unknown error'}</p></div>`;
                        resultEl.classList.add('result-error');
                    }
                })
                .catch(() => {
                    spinner.style.display = 'none';
                    document.querySelector('.btn-text').textContent = 'Analyze Image';
                    uploadBtn.disabled = false;
                    const resultEl = document.getElementById('result');
                    resultEl.innerHTML = '<div class="result-inner"><span class="result-icon error-icon">!</span><p class="result-label">Upload failed</p></div>';
                    resultEl.classList.add('result-error');
                });
        });
    </script>
</body>
</html>
